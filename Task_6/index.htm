<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Secure Form with Auth</title>
<style>
  body { font-family: Arial; margin: 40px; background: #f4f4f4; }
  form, .section { background: #fff; padding: 20px; margin: 20px 0; border-radius: 8px; }
  input, textarea { display: block; width: 100%; margin: 8px 0; padding: 8px; }
  button { padding: 8px 16px; }
</style>
</head>
<body>
<h2>User Authentication + Secure Form</h2>

<div class="section" id="auth">
  <h3>Register</h3>
  <form id="registerForm">
    <input type="text" id="regUser" placeholder="Username" required>
    <input type="password" id="regPass" placeholder="Password" required>
    <button type="submit">Register</button>
  </form>

  <h3>Login</h3>
  <form id="loginForm">
    <input type="text" id="logUser" placeholder="Username" required>
    <input type="password" id="logPass" placeholder="Password" required>
    <button type="submit">Login</button>
  </form>
</div>

<div class="section" id="formSection" style="display:none;">
  <h3>Submit Form</h3>
  <form id="dataForm">
    <input type="text" id="name" placeholder="Name" required>
    <input type="email" id="email" placeholder="Email" required>
    <textarea id="message" placeholder="Message" required></textarea>
    <button type="submit">Save Data</button>
  </form>
  <button id="loadData">Load My Data</button>
  <div id="output"></div>
</div>

<script>
let token = '';

document.getElementById('registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const res = await fetch('/api/register', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      username: regUser.value,
      password: regPass.value
    })
  });
  alert((await res.json()).message);
});

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const res = await fetch('/api/login', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      username: logUser.value,
      password: logPass.value
    })
  });
  const data = await res.json();
  if (data.token) {
    token = data.token;
    alert('Login successful!');
    document.getElementById('formSection').style.display = 'block';
  } else {
    alert(data.message);
  }
});

document.getElementById('dataForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const res = await fetch('/api/form', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': token },
    body: JSON.stringify({
      name: name.value,
      email: email.value,
      message: message.value
    })
  });
  alert((await res.json()).message);
});

document.getElementById('loadData').addEventListener('click', async () => {
  const res = await fetch('/api/form', {
    headers: { 'Authorization': token }
  });
  const data = await res.json();
  document.getElementById('output').innerHTML =
    '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
});
</script>
</body>
</html>
